ext {
    // Health Connect's client SDK requires API 26 (its own manifest declares
    // this) — @capgo/capacitor-health's merged manifest fails the build
    // below that. Scoped to voeding-app only (this file is separate from
    // root android/variables.gradle, which stays at 24 for workout-app).
    // No real-world downside for a single-user app: API 24/25 is Android
    // 7.x (2016), irrelevant to whatever phone this is actually installed on.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}