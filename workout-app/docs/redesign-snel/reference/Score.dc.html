<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Workout score</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&amp;family=Barlow:ital,wght@0,400;0,500;0,600;1,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF6B3D}a:hover{color:#FF9470}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1116; color: #EEF1F5; font-family: 'Barlow', system-ui, sans-serif; position: relative; overflow: hidden">

<div aria-hidden="true" style="padding: 20px; display: flex; flex-direction: column; gap: 14px; opacity: 0.4">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-style: italic; font-size: 44px; text-transform: uppercase">Week 3 / 10</div>
<div style="height: 36px; display: flex; gap: 8px"><div style="flex: 1; border-radius: 9px; background: #161B22"></div><div style="flex: 1; border-radius: 9px; background: #FF6B3D"></div><div style="flex: 1; border-radius: 9px; background: #161B22"></div></div>
<div style="height: 96px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<div style="border-radius: 12px; border: 1px solid #FF6B3D; background: #1F1712"></div><div style="border-radius: 12px; background: #161B22"></div><div style="border-radius: 12px; background: #161B22"></div><div style="border-radius: 12px; background: #161B22"></div><div style="border-radius: 12px; background: #161B22"></div><div style="border-radius: 12px; background: #161B22"></div><div style="border-radius: 12px; background: #161B22"></div>
</div>
<div style="height: 220px; border-radius: 16px; background: #161B22"></div>
<div style="height: 220px; border-radius: 16px; background: #161B22"></div>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(5, 7, 10, 0.7)"></div>

<section role="dialog" aria-label="Training scoren" style="position: absolute; left: 12px; right: 12px; top: 250px; box-sizing: border-box; background: #161B22; border: 1px solid #2A313C; border-radius: 20px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-style: italic; font-size: 30px; line-height: 1; text-transform: uppercase">Borst &amp; Triceps</h2>
</div>

<sc-for list="{{vragen}}" as="v" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<span style="font-size: 16px; font-weight: 600; text-align: center">{{v.vraag}}</span>
<div role="radiogroup" aria-label="{{v.vraag}}" style="display: flex; gap: 4px">
<sc-for list="{{v.sterren}}" as="s" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{s.aan}}" aria-label="{{s.label}}" onClick="{{s.kies}}" style="width: 48px; height: 48px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="{{s.vul}}" stroke="{{s.rand}}" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"></path></svg>
</button>
</sc-for>
</div>
<span style="min-height: 20px; font-size: 14px; font-style: italic; color: {{v.betekenisKleur}}; text-align: center">{{v.betekenis}}</span>
</div>
</sc-for>

<button type="button" disabled="{{uit}}" style="min-height: 52px; border: none; border-radius: 14px; background: {{knopBg}}; color: {{knopFg}}; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-style: italic; font-size: 20px; letter-spacing: 1px; text-transform: uppercase">Opslaan</button>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B3D","options":["#FF6B3D","#C6F432","#3DDCFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF6B3D';
    const s = this.state || {};
    const maak = (key, vraag) => {
      const n = s[key] || 0;
      return {
        vraag,
        betekenis: n ? '[betekenis bij ' + n + (n === 1 ? ' ster' : ' sterren') + ', uit de code]' : '',
        betekenisKleur: n ? '#C2CAD4' : '#5E6876',
        sterren: [1, 2, 3, 4, 5].map((i) => ({
          aan: i <= n ? 'true' : 'false',
          label: i + (i === 1 ? ' ster' : ' sterren'),
          vul: i <= n ? accent : 'none',
          rand: i <= n ? accent : '#5E6876',
          kies: () => this.setState({ [key]: i })
        }))
      };
    };
    const klaar = (s.training || 0) > 0 && (s.energie || 0) > 0;
    return {
      accent,
      vragen: [maak('training', 'Hoe ging de training?'), maak('energie', 'Hoe was je energie voor de training?')],
      uit: !klaar,
      knopBg: klaar ? accent : '#2A313C',
      knopFg: klaar ? '#0E1116' : '#5E6876'
    };
  }
}
</script>
</body>
</html>
